name: Cold Chain Data Analytics CI

on:
  push:
    paths:
      - "data-analytics/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "data-analytics/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyarrow==17.0.0

      - name: Run ETL tests
        run: python -m pytest data-analytics/tests/test_etl.py -v

      - name: Check Python syntax
        run: |
          python -m py_compile data-analytics/glue/cold_chain_etl.py
          python -m py_compile data-analytics/tests/test_etl.py
